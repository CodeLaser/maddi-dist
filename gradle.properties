group=io.codelaser
version=0.9.8
# A rebuild of the IntelliJ plugin alone, as <version>.<patch> (maddi-intellij/build.gradle.kts); empty for a release
intellijPluginPatch=
# The versions of maddi (base) and maddi-mod this repository builds against. From source (includeBuild) the
# coordinates resolve to their projects whatever these say; keep them at the siblings' versions all the same.
maddiVersion=0.9.8
maddiModVersion=0.9.8
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
